schema_version: "1"
experiment_id: nsclc-clinical-coordination-smoke-repaired-20260830
description: >-
  One-replicate live functionality test of persistent, sequential, and
  deliberative workflows on the clean named synthetic NSCLC clinical cohort.
output_root: results/nsclc_smoke_repaired_20260830
workspace_strategy: copy

tasks:
  - id: ds001-nsclc-treatment-heterogeneity
    public_workspace: ../../example_data_clinical_all_claude/ds001/nsclc/named/public
    private_evaluation_path: ../../example_data_clinical_all_claude/ds001/nsclc/named/manifest.json
    metadata:
      dataset_id: ds001_nsclc
      public_data_sha256: c93065845b99676904f8ec902b0c1c24fb0ab98579e084c706bcdf804d025fbb
      analysis_mode: named-clinical-discovery
    prompt: |-
      Analyze the patient-level synthetic NSCLC cohort in dataset.parquet to
      discover treatment-effect heterogeneity for progression-free survival.
      The workspace also contains dataset_description.md. You are not told how
      many signals exist, which treatment is involved, or the form or size of
      any signal.

      Use python3.13 in the staged workspace for executable analysis with
      pandas, scipy, and statsmodels. Consider all
      treatment columns and systematically investigate credible one- and
      multi-feature subgroup interactions. Do not privilege familiar clinical
      associations over the observed data. Guard against multiplicity and
      distinguish a subgroup interaction from a treatment main effect by
      checking the corresponding out-of-subgroup contrast.

      Report at most three ranked claims. For every supported claim, state the
      exposure, outcome, direction, exact subgroup predicates, estimand and
      method, signed effect estimate and unit, uncertainty or p-value,
      subgroup/exposed/comparator sample sizes, and supporting file or
      statistic. Mark exploratory or inadequately supported claims as such.
      Keep the handoff self-contained and under 1,200 words.

models:
  - id: codex-luna-low-0_151_0a7_1
    model_id: gpt-5.6-luna
    adapter: cli-json
    command:
      - /Users/klkehl/Library/CloudStorage/OneDrive-MassGeneralBrighamIncorporated/Ken_Kehl_grants/co_scientist_r01/onc-co-scientist/.venv/bin/python
      - /Users/klkehl/Library/CloudStorage/OneDrive-MassGeneralBrighamIncorporated/Ken_Kehl_grants/co_scientist_r01/onc-co-scientist/scripts/codex_cli_json_adapter.py
    extra_args:
      - --codex
      - /Applications/ChatGPT.app/Contents/Resources/codex
      - --reasoning-effort
      - low
      - --analysis-python
      - /Users/klkehl/Library/CloudStorage/OneDrive-MassGeneralBrighamIncorporated/Ken_Kehl_grants/co_scientist_r01/onc-co-scientist/.venv/bin/python
      - --timeout-seconds
      - "1180"
    reasoning_effort: low

workflows:
  - id: persistent
    mode: persistent
    safeguards: &common_safeguards
      preliminary_commitment: true
      evidence_ledger: true
      minority_report: true
      independent_rerun: false
  - id: sequential
    mode: sequential
    safeguards: *common_safeguards
  - id: deliberative
    mode: deliberative
    agents_per_stage: 2
    deliberation_rounds: 1
    safeguards: *common_safeguards

stages:
  - id: hypothesis_generation
    role: hypothesis scientist
    instructions: >-
      Inspect the public schema and data, preregister a ranked and falsifiable
      search plan, and generate specific candidate treatment-by-subgroup
      hypotheses. State expected direction, predicates, outcome, alternatives,
      and how each will be distinguished from a main effect.
  - id: analysis
    role: analysis scientist
    instructions: >-
      Execute a systematic, reproducible analysis of the candidates and viable
      alternatives. Report signed effects, uncertainty, sample sizes,
      multiplicity handling, diagnostics, out-of-subgroup contrasts, and null
      findings. Populate structured claims only when supported by the analysis.
  - id: critique
    role: critical reviewer
    instructions: >-
      Audit all prior claims and code for leakage, data errors, confounding,
      sparse cells, multiple testing, overfitting, sign mistakes, and failure to
      distinguish interaction from main effect. Reanalyze disputed findings and
      clearly retract, refine, or rescue them.
  - id: synthesis
    role: synthesis scientist
    instructions: >-
      Produce the final ranked scientific result using only reproducible
      evidence. Preserve exact subgroup predicates and quantitative support,
      distinguish supported, negative, and unresolved findings, and select the
      strongest supported claim in final_answer.

replicates: 1
max_parallel: 3
budget:
  max_agent_calls: 12
  max_runtime_seconds_per_call: 1200
