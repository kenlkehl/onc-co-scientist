   <g id="text_9">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle" x="270" y="143.856" transform="rotate(-0 270 143.856)">Each term specifies an exposure, comparison, outcome, and subgroup.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="132.3" y="182.230594" transform="rotate(-0 132.3 182.230594)">Version A: focal expected</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(57.872344 201.013781)">3 expected · 2 neutral · 1 surprising</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(55.322688 212.192844)">Focal direction: literature-concordant</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="407.7" y="182.230594" transform="rotate(-0 407.7 182.230594)">Version B: focal surprising</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(333.272344 201.013781)">2 expected · 2 neutral · 2 surprising</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(332.224469 212.192844)">Focal direction: literature-discordant</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="270" y="228.528" transform="rotate(-0 270 228.528)">Five background discoveries, covariates, and residual draws remain fixed</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="270" y="240.624" transform="rotate(-0 270 240.624)">Verify full-DGP contrasts and calibrate paired statistical difficulty</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="10.8" y="268.422281" transform="rotate(-0 10.8 268.422281)">Aim 1b. Deploy fresh agents and evaluate the research process</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="78.3" y="307.510594" transform="rotate(-0 78.3 307.510594)">Independent runs</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(21.936875 326.0235)">One dataset version per run</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(14.585 336.0235)">Fixed iteration and tool budgets</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(19.145 346.7985)">Private evaluator retains DGP</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="251.1" y="303.190594" transform="rotate(-0 251.1 303.190594)">Explore</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="251.1" y="321.523312" transform="rotate(-0 251.1 321.523312)">Record hypotheses; select analyses</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="442.8" y="303.190594" transform="rotate(-0 442.8 303.190594)">Analyze and validate</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="442.8" y="321.523312" transform="rotate(-0 442.8 321.523312)">New evidence for selected hypotheses</text>
   </g>
