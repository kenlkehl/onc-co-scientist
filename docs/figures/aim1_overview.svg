   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="10.8" y="16.998281" transform="rotate(-0 10.8 16.998281)">Aim 1a. Generate datasets with known discoveries</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="89.1" y="52.630594" transform="rotate(-0 89.1 52.630594)">Propose and review</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(35.469031 71.413781)">LLM proposes hypotheses</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(25.707453 81.788781)">Search and compare literature</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(20.900586 92.163781)">Replace unsupported candidates</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="270" y="52.630594" transform="rotate(-0 270 52.630594)">Specify the full DGP</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(208.126094 71.413781)">Clinical or DepMap covariates</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(215.522172 82.592844)">Six embedded discoveries</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(207.309062 92.163781)">Expected · neutral · surprising</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #21312c" x="450.9" y="52.630594" transform="rotate(-0 450.9 52.630594)">Select one discovery</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(411.124195 71.794414)">Overall reversal, or</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(384.142063 81.788781)">reversal within a fixed subgroup</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #21312c" transform="translate(387.328484 92.163781)">with expected overall ordering</text>
   </g>
