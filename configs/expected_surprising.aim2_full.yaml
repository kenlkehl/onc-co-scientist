# All 20 frozen tasks x 3 workflows x 5 model profiles x 10 repeats = 3,000 runs.
# Narrow profiles/pair_ids/models before a smaller study. This file does not launch itself.
experiment_id: expected_surprising_aim2_full
output_root: ../data/expected_surprising_aim2/full
