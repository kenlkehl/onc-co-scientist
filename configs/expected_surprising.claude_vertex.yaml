# A six-iteration setup grid; prepare_claude_grid.py freezes both semantic twins.
experiment_id: claude_vertex_expected_surprising
output_root: ../data/claude_vertex_expected_surprising
expected_surprising:
  root: ../data/expected_surprising_ledger_25_iterations
  max_tokens_per_call: 32768
  max_retries_per_stage: 2
  persistent_history_chars: 120000
iteration_policy:
  iterations: 6
replicates: 1
max_parallel: 2
schedule_seed: 20260910
budget:
  max_agent_calls: 216
  max_runtime_seconds_per_call: 1800
models:
  - id: claude_opus
    model_id: claude-opus-5
    adapter: provider
    reasoning_effort: medium
    provider_config:
      kind: anthropic_vertex
      model_id: claude-opus-5
      region: global
      reasoning_effort: medium
      timeout_s: 1800
      max_retries: 2
workflows:
  - id: persistent
    mode: persistent
  - id: sequential
    mode: sequential
  - id: deliberative
    mode: deliberative
    agents_per_stage: 2
    deliberation_rounds: 1
