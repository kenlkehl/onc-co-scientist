schema_version: "1"
experiment_id: co-scientist-smoke-test
description: Demonstrate matched persistent, sequential, deliberative, and federated runs.
output_root: ../data/co_scientist_smoke
workspace_strategy: reference

tasks:
  - id: depmap-example
    prompt: >
      Identify and test a biologically coherent dependency subgroup in the
      supplied cancer cell-line dataset. Report null findings and alternative
      explanations as well as the strongest supported hypothesis.
    public_workspace: ../example_data_depmap_all_codex/tasks/depmap/named
    # These reuse one public example solely for a no-cost smoke test. A real
    # federated task should point each site to a different isolated workspace.
    site_workspaces:
      site_a: ../example_data_depmap_all_codex/tasks/depmap/named
      site_b: ../example_data_depmap_all_codex/tasks/depmap/named

models:
  - id: deterministic-smoke
    model_id: stub
    adapter: stub

workflows:
  - id: persistent
    mode: persistent
  - id: sequential-handoffs
    mode: sequential
  - id: deliberative
    mode: deliberative
    agents_per_stage: 2
    deliberation_rounds: 2
    safeguards:
      preliminary_commitment: true
      evidence_ledger: true
      minority_report: true
  - id: federated-sequential
    mode: sequential
    federated: true
    safeguards:
      evidence_ledger: true
      minority_report: true

replicates: 1
max_parallel: 2
budget:
  max_agent_calls: 64
  max_input_tokens: 200000
  max_output_tokens: 50000
  max_tool_calls: 100
  max_cost_usd: 25
  max_runtime_seconds_per_call: 900
