# Separate from the legacy named/masked synthetic configuration.
seed: 42000
clinical_n: 50000
depmap_n: 2000
max_candidate_rounds: 8
expected_candidates:
  # The remainder of each six-discovery inventory is neutral. One reviewed
  # expected candidate becomes a fixed surprising background discovery.
  # AML clinical PFS has fewer supported comparisons under exact endpoint review.
  aml_clinical: 3
  aml_depmap: 3
max_tokens_per_call: 125000
max_retries_per_stage: 2
provider:
  kind: gemini_vertex
  model_id: gemini-3.8-flash
  location: global
  timeout_s: 120
  max_retries: 2
  reasoning_effort: low
# A separate model call critiques each literal claim without seeing the first
# reviewer's verdict, then checks the compiled DGP before materialization.
realism_provider:
  kind: gemini_vertex
  model_id: gemini-3.8-flash
  location: global
  timeout_s: 120
  max_retries: 2
  reasoning_effort: medium
