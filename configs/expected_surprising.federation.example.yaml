# Configuration example only; this file does not launch a run.
# 2 paired versions × 3 site workflows × 5 site/partition conditions = 30 runs.
experiment_id: clinical_significance_10pct_federation_example
output_root: ../data/expected_surprising_federation/example
expected_surprising:
  root: ../data/expected_surprising_ledger_25_iterations
  pair_ids: [es-v2-nsclc_clinical-42000]
  max_tokens_per_call: 125000
  max_retries_per_stage: 2
  persistent_history_chars: 120000
federation:
  site_counts: [1, 2, 4]
  seed: 20260908
  partitions:
    - id: random
      mode: random
    - id: age_sorted
      mode: heterogeneous
      by: [age_years]
  # Omit to use the same model for the central agent and every site.
  # orchestrator_model_profile: terra_medium
iteration_policy:
  iterations: 6
replicates: 1
max_parallel: 3
schedule_seed: 20260908
budget:
  max_agent_calls: 1008
  max_runtime_seconds_per_call: 1800
models:
  - id: terra_medium
    model_id: gpt-5.6-terra
    adapter: provider
    reasoning_effort: medium
    provider_config:
      kind: codex_cli
      model_id: gpt-5.6-terra
      reasoning_effort: medium
      service_tier: default
      timeout_s: 1800
workflows:
  - id: persistent
    mode: persistent
  - id: sequential
    mode: sequential
  - id: deliberative
    mode: deliberative
    agents_per_stage: 2
    deliberation_rounds: 1
